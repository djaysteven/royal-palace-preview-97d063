<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("pattaya-demo-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t;
        var l = localStorage.getItem("pattaya-demo-lang");
        if (l !== "th" && l !== "en") {
          var n = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
          l = String(n).toLowerCase().indexOf("th") === 0 ? "th" : "en";
        }
        document.documentElement.lang = l;
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.colorScheme = "dark";
      }
    })();
  </script>
  <meta name="color-scheme" content="dark light" />
  <title>Royal Palace Hotel — before and after</title>
  <meta name="description" content="How the Royal Palace Hotel Pattaya ledger sits beside the hotel’s 2008 site." />
  <link rel="icon" href="images/brand/logo.gif" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <noscript><style>html body{visibility:visible}</style></noscript>
</head>
<body>
  <div id="themeLive" class="sr-only" aria-live="polite"></div>
  <header class="site-header">
    <div class="nav">
      <a class="brand" href="index.html" data-i18n-aria="aria.home" aria-label="Royal Palace Hotel home">
        <span class="brand-seal"><img src="images/brand/logo.gif" alt="" width="116" height="101" data-i18n-alt="seal.alt" /></span>
        <span class="brand-name">
          <strong data-i18n="brand.name">Royal Palace</strong>
          <span data-i18n="brand.place">Pattaya</span>
        </span>
      </a>
      <div class="header-tools">
        <div class="theme-switch theme-switch--header" role="group" data-i18n-aria="theme.appearance" aria-label="Appearance">
          <button type="button" data-theme-set="dark" aria-pressed="true" data-i18n-aria="theme.dark" aria-label="Dark">
            <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          </button>
          <button type="button" data-theme-set="light" aria-pressed="false" data-i18n-aria="theme.light" aria-label="Light">
            <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
        <div class="lang-switch" role="group" data-i18n-aria="aria.lang" aria-label="Language">
          <button type="button" data-lang="th" aria-pressed="false">🇹🇭 TH</button>
          <button type="button" data-lang="en" aria-pressed="true">🇬🇧 EN</button>
        </div>
        <a class="btn btn-primary nav-cta" href="index.html#contact" data-i18n="nav.enquire">Enquire</a>
      </div>
    </div>
  </header>

  <main class="section page-intro">
    <div class="container">
      <p class="kicker"><i>08</i> <span data-i18n="cmp.kicker">Reading</span></p>
      <h2 data-i18n="cmp.title">The 2008 site, and this ledger</h2>
      <p class="lead" data-i18n="cmp.lead"></p>
      <div class="compare-grid">
        <article class="old-frame">
          <div class="brand-seal"><img src="images/brand/logo.gif" alt="Royal Palace Hotel" width="116" height="101" /></div>
          <h3 data-i18n="cmp.old.h">As published</h3>
          <p data-i18n="cmp.old.p"></p>
          <p>royalpalacepattaya.com</p>
          <p>215 M.10 Pattaya 2nd Road · +66 3842 6262–6 · info@royalpalacepattaya.com</p>
        </article>
        <article class="glass-card">
          <div class="brand-seal"><img src="images/brand/logo.gif" alt="" width="116" height="101" /></div>
          <h3 data-i18n="cmp.new.h">This ledger</h3>
          <p data-i18n="cmp.new.p"></p>
          <p style="margin-top:.8rem"><a class="btn btn-primary" href="index.html" data-i18n="cmp.back">Open the ledger</a></p>
        </article>
      </div>
      <div class="compare-grid">
        <article class="glass-card">
          <h3 data-i18n="cmp.kept">Kept</h3>
          <ul class="compare-list">
            <li data-i18n="cmp.kept.1"></li>
            <li data-i18n="cmp.kept.2"></li>
            <li data-i18n="cmp.kept.3"></li>
            <li data-i18n="cmp.kept.4"></li>
            <li data-i18n="cmp.kept.5"></li>
            <li data-i18n="cmp.kept.6"></li>
            <li data-i18n="cmp.kept.7"></li>
            <li data-i18n="cmp.kept.8"></li>
          </ul>
        </article>
        <article class="glass-card">
          <h3 data-i18n="cmp.not">Not invented</h3>
          <ul class="compare-list">
            <li data-i18n="cmp.not.1"></li>
            <li data-i18n="cmp.not.2"></li>
            <li data-i18n="cmp.not.3"></li>
            <li data-i18n="cmp.not.4"></li>
          </ul>
        </article>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-brand">
        <p data-i18n="footer.copy"></p>
        <p><a href="index.html" data-i18n="cmp.back">Open the ledger</a></p>
      </div>
      <div class="vantage-attr">
        <img src="images/vantage.png" alt="Vantage" />
        <p><strong>VANTAGE</strong><span data-i18n="footer.tag">GET THE VANTAGE POINT YOU DESERVE.</span></p>
      </div>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
